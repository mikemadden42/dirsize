name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Build and smoke-test every build type the toolchain supports (including
    # sanitizers) on each platform, using that platform's run-builds script
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # Recent kernels use more mmap randomness than TSan supports
    - name: Lower ASLR entropy for sanitizers
      if: runner.os == 'Linux'
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Run builds (bash)
      if: runner.os != 'Windows'
      run: ./run-builds.bash

    - name: Run builds (PowerShell)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./run-builds.ps1

    - name: Run builds (batch)
      if: runner.os == 'Windows'
      shell: cmd
      run: run-builds.bat
